# ============================================================
# スケジュールジョブ設定
# このファイルを保存するとボットが自動で再読み込みします
# チャンネルIDは /cron-id コマンドで確認できます
# ============================================================
#
# cron式の書き方:
#   ┌─ 分 (0-59)
#   │ ┌─ 時 (0-23)
#   │ │ ┌─ 日 (1-31)
#   │ │ │ ┌─ 月 (1-12)
#   │ │ │ │ ┌─ 曜日 (0=日, 1=月, ..., 6=土)
#   │ │ │ │ │
#   * * * * *
#
# よく使う例:
#   "0 9 * * *"    毎日 9:00
#   "0 9 * * 1-5"  平日 9:00
#   "0 18 * * 1-5" 平日 18:00
#   "0 9 * * 1"    毎週月曜 9:00
#   "0 0 1 * *"    毎月1日 0:00
#   "*/30 * * * *" 30分ごと
# ============================================================

jobs:

  # ----------------------------------------------------------
  # 繰り返しジョブ（type: repeat）
  # ----------------------------------------------------------

  - id: daily-report
    description: 毎日の日報
    type: repeat
    cron: "0 18 * * 1-5"   # 平日18:00
    channel_id: "YOUR_CHANNEL_ID_HERE"
    prompt: |
      今日の作業を振り返り、完了したことと課題をまとめてください。
    enabled: false

  - id: weekly-plan
    description: 週次計画
    type: repeat
    cron: "0 9 * * 1"      # 毎週月曜9:00
    channel_id: "YOUR_CHANNEL_ID_HERE"
    prompt: |
      今週の目標と優先タスクをリストアップしてください。
    enabled: false

  # ----------------------------------------------------------
  # 単発ジョブ（type: once）
  # 実行後は自動でこのファイルから削除され backlog.yaml に移動します
  # ----------------------------------------------------------

  - id: project-kickoff
    description: プロジェクトXキックオフリマインダー
    type: once
    datetime: "2026-03-01 09:00"   # YYYY-MM-DD HH:MM
    channel_id: "YOUR_CHANNEL_ID_HERE"
    prompt: |
      プロジェクトXのキックオフミーティングが始まります。
      アジェンダと参加者への注意事項をまとめてください。
    enabled: false
