services:
  discoai:
    build: .
    restart: unless-stopped

    # discoAIがアクセスできるのは workspace/ のみ
    # ボット本体（/app）はコンテナ内に閉じ込め、ホストからは見えない
    volumes:
      - ./workspace:/workspace

    # .envから環境変数を読み込む（シークレットはイメージに含めない）
    env_file:
      - .env

    # WORK_DIRを明示的に上書き（.envに書かれていても/workspaceを強制）
    environment:
      - WORK_DIR=/workspace
